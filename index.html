<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>영화 추천 서비스 - 홈</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #121212;
        color: #e0e0e0;
      }

      nav {
        background-color: #1e1e1e;
        padding: 20px;

        margin-bottom: 30px;
        box-shadow: 0 2px 10px rgba(0, 255, 255, 0.1);
      }
      nav ul {
        list-style: none;
        margin: 0;
        display: flex;
        gap: 30px;
      }
      nav ul li a {
        color: #00ffff;
        text-decoration: none;
        font-size: 18px;
        transition: 0.3s;
      }
      nav ul li a:hover {
        color: #ffffff;
      }
      nav ul li a:hover {
        color: #ffffff;
        text-shadow: 0 0 8px #00ffff;
      }

      .hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px 20px;
        background: url("https://images.unsplash.com/photo-1603437873662-52cebea04052?auto=format&fit=crop&w=1400&q=80")
          no-repeat center center/cover;
        text-align: center;
        color: #ffffff;
        text-shadow: 0 0 5px rgba(0, 255, 255, 0.4);
      }

      .hero h1 {
        font-size: 3em;
        margin-bottom: 20px;
        color: #00ffff;
      }

      .hero p {
        font-size: 1.2em;
        max-width: 600px;
        margin-bottom: 30px;
      }

      .hero a {
        display: inline-block;
        padding: 12px 30px;
        background-color: #00ffff;
        color: #121212;
        text-decoration: none;
        font-weight: bold;
        border-radius: 30px;
        transition: background-color 0.3s ease;
      }

      .hero a:hover {
        background-color: #00dddd;
      }

      .footer {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        font-size: 12px;
        padding: 20px;
        color: #888;
        border-top: 1px solid #333;
      }

      @media (max-width: 600px) {
        .hero h1 {
          font-size: 2em;
        }

        .hero p {
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="../index.html">홈</a></li>
        <li><a href="../pages/movie.html">인기 영화 목록</a></li>
      </ul>
    </nav>
    <section class="hero">
      <h1>당신의 다음 영화는?</h1>
      <p>
        전 세계 인기 영화부터, 지금 놓치면 안 될 명작까지.<br />
        감성적인 영화 탐험을 지금 시작하세요.
      </p>
      <a href="../pages/movie.html">인기 영화 보러가기</a>
    </section>

    <div class="footer">© 2025 유진의 영화 서비스. All rights reserved.</div>
  </body>
</html>
